<style>
  :root {
    --ground: #f1efe9;
    --surface: #fbfaf7;
    --surface-2: #e9e6de;
    --ink: #1b1b20;
    --ink-2: #6c6e79;
    --rule: #d6d2c7;
    --blue: #2e4a8c;
    --blue-wash: #e3e7f2;
    --pink: #e0357f;
    --pink-wash: #fbe4ee;
    --font-display: "Archivo", "PingFang TC", "Hiragino Sans", sans-serif;
    --font-body: "IBM Plex Sans", "PingFang TC", "Hiragino Sans", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #131418;
      --surface: #1c1d23;
      --surface-2: #24262e;
      --ink: #ecebe7;
      --ink-2: #9a9ca8;
      --rule: #343640;
      --blue: #8aa6e8;
      --blue-wash: #232838;
      --pink: #ff6fa8;
      --pink-wash: #35202b;
    }
  }
  :root[data-theme="dark"] {
    --ground: #131418;
    --surface: #1c1d23;
    --surface-2: #24262e;
    --ink: #ecebe7;
    --ink-2: #9a9ca8;
    --rule: #343640;
    --blue: #8aa6e8;
    --blue-wash: #232838;
    --pink: #ff6fa8;
    --pink-wash: #35202b;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
  }
  button, input, select { font: inherit; }
  :focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }
  [hidden] { display: none !important; }

  .page { max-width: 1460px; margin: 0 auto; padding: 0 28px 64px; }
  .masthead {
    display: flex;
    justify-content: space-between;
    gap: 42px;
    align-items: center;
    padding: 36px 0 24px;
    border-bottom: 2px solid var(--ink);
  }
  .hero-copy { min-width: 0; }
  .home-link {
    display: inline-block;
    margin-bottom: 12px;
    color: var(--pink);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .08em;
    text-decoration: none;
  }
  .home-link:hover { text-decoration: underline; text-underline-offset: 3px; }
  h1 {
    margin: 0 0 10px;
    font-family: var(--font-display);
    font-size: clamp(30px, 4vw, 48px);
    line-height: 1.08;
    letter-spacing: -.025em;
  }
  .lede { max-width: 66ch; margin: 0; color: var(--ink-2); }
  .hero-visual {
    flex: 0 0 auto;
    display: grid;
    justify-items: center;
    gap: 10px;
  }
  .photo-booth-image {
    display: block;
    width: 196px;
    height: 196px;
    background: #111727;
    object-fit: cover;
  }
  .privacy-badge {
    padding: 8px 11px;
    border: 1px solid var(--blue);
    color: var(--blue);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .04em;
    white-space: nowrap;
  }

  .workspace {
    display: grid;
    grid-template-columns: minmax(290px, 380px) minmax(0, 1fr);
    gap: 28px;
    align-items: start;
    padding-top: 28px;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--rule);
  }
  .controls { padding: 20px; }
  .section + .section { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--rule); }
  .section-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 12px;
    font-family: var(--font-display);
    font-size: 17px;
  }
  .step {
    color: var(--pink);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .12em;
  }
  .upload {
    display: grid;
    place-items: center;
    min-height: 132px;
    padding: 20px;
    border: 1.5px dashed var(--blue);
    background: var(--blue-wash);
    color: var(--blue);
    text-align: center;
    cursor: pointer;
    transition: border-color .12s ease, background .12s ease;
  }
  .upload.is-dragging { border-color: var(--pink); background: var(--pink-wash); }
  .upload strong { display: block; margin-bottom: 3px; font-size: 15px; }
  .upload small { color: var(--ink-2); }
  .upload input { position: absolute; inline-size: 1px; block-size: 1px; opacity: 0; }

  .field { display: grid; gap: 6px; margin-top: 12px; }
  .field:first-of-type { margin-top: 0; }
  .field > span, .field-label { color: var(--ink-2); font-size: 12px; font-weight: 600; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input[type="text"], input[type="date"], select {
    width: 100%;
    min-height: 40px;
    border: 1px solid var(--rule);
    border-radius: 0;
    background: var(--ground);
    color: var(--ink);
    padding: 8px 10px;
  }
  input[type="range"] { width: 100%; accent-color: var(--pink); }
  .range-head { display: flex; justify-content: space-between; gap: 12px; }
  output { color: var(--pink); font-family: var(--font-mono); font-size: 11px; }
  .check {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    margin-top: 14px;
    color: var(--ink-2);
    font-size: 13px;
  }
  .check input { margin: 3px 0 0; accent-color: var(--pink); }
  .hint { margin: 9px 0 0; color: var(--ink-2); font-size: 12px; }

  .preview-panel { min-width: 0; padding: 18px; }
  .preview-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
  }
  .preview-head h2 { margin: 0; font-family: var(--font-display); font-size: 18px; }
  .preview-head p { margin: 0; color: var(--ink-2); font-size: 12px; }
  .canvas-wrap {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--rule);
    background: #fff;
    box-shadow: 0 14px 34px rgb(20 25 38 / .12);
    touch-action: none;
    cursor: grab;
  }
  .canvas-wrap:active { cursor: grabbing; }
  canvas { display: block; width: 100%; height: auto; }
  .canvas-help {
    position: absolute;
    left: 12px;
    bottom: 12px;
    padding: 5px 8px;
    background: rgb(255 255 255 / .88);
    color: #3f4f69;
    border: 1px solid rgb(84 144 186 / .25);
    font-size: 11px;
    pointer-events: none;
    backdrop-filter: blur(5px);
  }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
  .button {
    min-height: 42px;
    padding: 9px 16px;
    border: 1px solid var(--ink);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .button:hover { background: var(--surface-2); }
  .button.primary { border-color: var(--pink); background: var(--pink); color: #fff; font-weight: 600; }
  .button.primary:hover { filter: brightness(.92); }
  .button:disabled { cursor: not-allowed; opacity: .42; }
  .status { min-height: 1.4em; margin: 8px 0 0; color: var(--ink-2); font-size: 12px; text-align: right; }

  .site-footer {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-top: 32px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    color: var(--ink-2);
    font-size: 12px;
  }
  .site-footer a { color: var(--pink); }

  @media (max-width: 940px) {
    .workspace { grid-template-columns: 1fr; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
    .section + .section { margin-top: 0; padding-top: 0; border-top: 0; }
    .section:nth-child(n+3) { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--rule); }
  }
  @media (max-width: 640px) {
    .page { padding: 0 16px 44px; }
    .masthead { display: block; padding-top: 26px; }
    .hero-visual {
      width: 100%;
      grid-template-columns: auto auto;
      justify-content: space-between;
      align-items: end;
      margin-top: 22px;
      padding: 0 7px 7px 0;
    }
    .photo-booth-image { width: 152px; height: 152px; }
    .privacy-badge { align-self: center; }
    .workspace { gap: 18px; padding-top: 18px; }
    .controls { display: block; padding: 16px; }
    .section + .section { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--rule); }
    .field-row { grid-template-columns: 1fr; }
    .preview-panel { padding: 10px; }
    .preview-head { display: block; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; }
    .button { width: 100%; }
    .canvas-help { display: none; }
    .site-footer { display: block; }
  }
</style>
</head>

          <input id="photoInput" type="file" accept="image/*">
        </label>
        <p class="hint">上傳後可直接拖曳右側相紙調整位置；八格會同步移動。</p>
      </div>

      <div class="section">
        <h2 class="section-title"><span>照片位置</span><span class="step">02 / CROP</span></h2>
        <label class="field">
          <span class="range-head"><span>放大</span><output id="zoomValue">100%</output></span>
          <input id="zoom" type="range" min="100" max="300" value="100" step="1">
        </label>
        <button class="button" id="resetCrop" type="button">重設照片位置</button>
      </div>

      <div class="section">
        <h2 class="section-title"><span>台紙文字</span><span class="step">03 / LABEL</span></h2>
        <label class="field">
          <span>顯示名稱／暱稱</span>
          <input id="displayName" type="text" value="フリーレン" maxlength="24" placeholder="例如：フリーレン">
        </label>
        <label class="field">
          <span>用途</span>
          <select id="purpose">
            <option value="履歴書・その他証明用">履歷／各類證明用</option>
            <option value="保存用">保存用</option>
            <option value="観賞用">觀賞用</option>
            <option value="custom">自訂</option>
          </select>
        </label>
        <label class="field" id="purposeCustomField" hidden>
          <span>自訂用途文字</span>
          <input id="purposeCustom" type="text" maxlength="30" placeholder="輸入日文或其他文字">
        </label>
        <label class="field">
          <span>尺寸標示</span>
          <select id="photoSize">
            <option value="タテ40mm × ヨコ30mm">40 × 30 mm</option>
            <option value="タテ45mm × ヨコ35mm">45 × 35 mm</option>
            <option value="">隱藏</option>
          </select>
        </label>
      </div>

      <div class="section">
        <h2 class="section-title"><span>日期與流水號</span><span class="step">04 / META</span></h2>
        <div class="field-row">
          <label class="field">
            <span>拍攝日期</span>
            <select id="dateMode">
              <option value="today">今天</option>
              <option value="custom">自訂</option>
              <option value="hidden">隱藏</option>
            </select>
          </label>
          <label class="field" id="dateCustomField" hidden>
            <span>自訂日期</span>
            <input id="customDate" type="date">
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span>流水號</span>
            <select id="serialMode">
              <option value="auto">自動產生</option>
              <option value="custom">自訂</option>
              <option value="hidden">隱藏</option>
            </select>
          </label>
          <label class="field" id="serialCustomField" hidden>
            <span>自訂流水號</span>
            <input id="customSerial" type="text" maxlength="18" placeholder="例如：0822-0148">
          </label>
        </div>
        <label class="check"><input id="showReceipt" type="checkbox" checked><span>顯示收據風裝飾</span></label>
      </div>

      <div class="section">
        <h2 class="section-title"><span>注意事項</span><span class="step">05 / NOTE</span></h2>
        <label class="field">
          <span>文案</span>
          <select id="noticeStyle">
            <option value="formal">正式版：不得用於正式證件</option>
            <option value="playful">幽默版：太可愛可能不合格</option>
          </select>
        </label>
      </div>
    </section>

    <section class="panel preview-panel" aria-label="相紙預覽">
      <div class="preview-head">
        <h2>完成預覽</h2>
        <p>輸出 1493 × 1053 PNG</p>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="sheet" width="1493" height="1053" aria-label="八格證明寫真風相紙預覽"></canvas>
        <span class="canvas-help" id="canvasHelp">上傳照片後，可在這裡拖曳調整位置</span>
      </div>
      <div class="actions">
        <button class="button" id="clearPhoto" type="button" disabled>清除照片</button>
        <button class="button primary" id="download" type="button">下載 PNG</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="site-footer">
    <span>© 2026 catcatcatcat · MIT License</span>
    <span>照片只在瀏覽器本機處理，不會上傳。<a href="../">回到貓貓工具箱</a></span>
  </footer>
</div>

<script>
(() => {
  'use strict';

  const W = 1493;
  const H = 1053;
  const slots = [
    { x: 132,  y: 76,  w: 294, h: 405 },
    { x: 438,  y: 76,  w: 298, h: 405 },
    { x: 748,  y: 76,  w: 298, h: 405 },
    { x: 1058, y: 76,  w: 297, h: 405 },
    { x: 132,  y: 570, w: 294, h: 408 },
    { x: 438,  y: 570, w: 298, h: 408 },
    { x: 748,  y: 570, w: 298, h: 408 },
    { x: 1058, y: 570, w: 297, h: 408 }
  ];

  const $ = (id) => document.getElementById(id);
  const canvas = $('sheet');
  const ctx = canvas.getContext('2d');
  const ui = {
    photoInput: $('photoInput'), uploadZone: $('uploadZone'), zoom: $('zoom'), zoomValue: $('zoomValue'),
    resetCrop: $('resetCrop'), displayName: $('displayName'), purpose: $('purpose'),
    purposeCustom: $('purposeCustom'), purposeCustomField: $('purposeCustomField'), photoSize: $('photoSize'),
    dateMode: $('dateMode'), customDate: $('customDate'), dateCustomField: $('dateCustomField'),
    serialMode: $('serialMode'), customSerial: $('customSerial'), serialCustomField: $('serialCustomField'),
    showReceipt: $('showReceipt'), noticeStyle: $('noticeStyle'), canvasWrap: $('canvasWrap'),
    canvasHelp: $('canvasHelp'), clearPhoto: $('clearPhoto'), download: $('download'), status: $('status')
  };

  const state = {
    image: null,
    imageUrl: '',
    zoom: 1,
    offsetX: 0,
    offsetY: 0,
    serial: createSerial(),
    dragging: false,
    pointerX: 0,
    pointerY: 0
  };

  function createSerial() {
    const now = new Date();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const suffix = String(Math.floor(Math.random() * 10000)).padStart(4, '0');
    return `${mm}${dd}-${suffix}`;
  }

  function formatDate(value) {
    if (!value) return '';
    const parts = value.split('-');
    return parts.length === 3 ? `${parts[0]}.${parts[1]}.${parts[2]}` : value;
  }

  function localToday() {
    const now = new Date();
    const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0, 10);
  }

  function selectedDate() {
    if (ui.dateMode.value === 'hidden') return '';
    return formatDate(ui.dateMode.value === 'custom' ? ui.customDate.value : localToday());
  }

  function selectedSerial() {
    if (ui.serialMode.value === 'hidden') return '';
    return ui.serialMode.value === 'custom' ? ui.customSerial.value.trim() : state.serial;
  }

  function selectedPurpose() {
    return ui.purpose.value === 'custom' ? (ui.purposeCustom.value.trim() || '観賞用') : ui.purpose.value;
  }

  function setFont(size, weight = 500, family = 'sans') {
    const stack = family === 'mono'
      ? '"IBM Plex Mono", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace'
      : '"IBM Plex Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif';
    ctx.font = `${weight} ${size}px ${stack}`;
  }

  function drawPaper() {
    ctx.fillStyle = '#fdfdfb';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 16) {
      ctx.strokeStyle = x % 80 === 0 ? 'rgba(62, 145, 201, .30)' : 'rgba(91, 163, 210, .18)';
      ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke();
    }
    for (let y = 0; y <= H; y += 16) {
      ctx.strokeStyle = y % 80 === 0 ? 'rgba(62, 145, 201, .30)' : 'rgba(91, 163, 210, .18)';
      ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke();
    }
    ctx.restore();

    ctx.strokeStyle = 'rgba(49, 73, 93, .42)';
    ctx.lineWidth = 2;
    ctx.strokeRect(10, 10, W - 20, H - 20);
    ctx.strokeStyle = 'rgba(49, 73, 93, .18)';
    ctx.strokeRect(20, 20, W - 40, H - 40);
  }

  function drawPlaceholder(slot) {
    const gradient = ctx.createLinearGradient(slot.x, slot.y, slot.x + slot.w, slot.y + slot.h);
    gradient.addColorStop(0, '#3c9bd5');
    gradient.addColorStop(.55, '#4ba4da');
    gradient.addColorStop(1, '#3491ca');
    ctx.fillStyle = gradient;
    ctx.fillRect(slot.x, slot.y, slot.w, slot.h);
  }

  function imagePlacement(slot) {
    const img = state.image;
    const cover = Math.max(slot.w / img.naturalWidth, slot.h / img.naturalHeight);
    const scale = cover * state.zoom;
    const dw = img.naturalWidth * scale;
    const dh = img.naturalHeight * scale;
    return {
      x: slot.x + (slot.w - dw) / 2 + state.offsetX,
      y: slot.y + (slot.h - dh) / 2 + state.offsetY,
      w: dw,
      h: dh
    };
  }

  function clampCrop() {
    if (!state.image) return;
    const slot = slots[0];
    const cover = Math.max(slot.w / state.image.naturalWidth, slot.h / state.image.naturalHeight);
    const dw = state.image.naturalWidth * cover * state.zoom;
    const dh = state.image.naturalHeight * cover * state.zoom;
    const maxX = Math.max(0, (dw - slot.w) / 2);
    const maxY = Math.max(0, (dh - slot.h) / 2);
    state.offsetX = Math.max(-maxX, Math.min(maxX, state.offsetX));
    state.offsetY = Math.max(-maxY, Math.min(maxY, state.offsetY));
  }

  function drawPhoto(slot) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(slot.x, slot.y, slot.w, slot.h);
    ctx.clip();
    drawPlaceholder(slot);
    const p = imagePlacement(slot);
    ctx.drawImage(state.image, p.x, p.y, p.w, p.h);
    ctx.restore();
  }

  function drawTriangle(x, y, direction) {
    ctx.fillStyle = '#18202b';
    ctx.beginPath();
    if (direction === 'down') {
      ctx.moveTo(x - 6, y - 4); ctx.lineTo(x + 6, y - 4); ctx.lineTo(x, y + 5);
    } else {
      ctx.moveTo(x - 6, y + 4); ctx.lineTo(x + 6, y + 4); ctx.lineTo(x, y - 5);
    }
    ctx.closePath(); ctx.fill();
  }

  function drawCutMarks() {
    slots.forEach((slot, index) => {
      ctx.strokeStyle = 'rgba(55, 92, 122, .22)';
      ctx.lineWidth = 1;
      ctx.strokeRect(slot.x - .5, slot.y - .5, slot.w + 1, slot.h + 1);
      const top = index < 4;
      drawTriangle(slot.x, top ? slot.y - 12 : slot.y + slot.h + 12, top ? 'down' : 'up');
      drawTriangle(slot.x + slot.w, top ? slot.y - 12 : slot.y + slot.h + 12, top ? 'down' : 'up');
    });
  }

  function drawVerticalText(text, x, y, size, color, weight = 600, spacing = 3) {
    ctx.save();
    ctx.fillStyle = color;
    setFont(size, weight);
    const chars = [...text];
    chars.forEach((char, i) => {
      const charY = y + i * (size + spacing);
      if (char === 'ー') {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(2, size * .09);
        ctx.lineCap = 'square';
        ctx.moveTo(x + size * .5, charY - size * .82);
        ctx.lineTo(x + size * .5, charY - size * .12);
        ctx.stroke();
      } else {
        ctx.fillText(char, x, charY);
      }
    });
    ctx.restore();
  }

  function fitText(text, maxWidth, initialSize, minSize = 16) {
    let size = initialSize;
    while (size > minSize) {
      setFont(size, 600);
      if (ctx.measureText(text).width <= maxWidth) break;
      size -= 1;
    }
    return size;
  }

  function drawLabels() {
    const purpose = selectedPurpose();
    const sizeText = ui.photoSize.value;
    const date = selectedDate();
    const serial = selectedSerial();
    const name = ui.displayName.value.trim() || 'NAME';

    ctx.fillStyle = '#243141';
    setFont(fitText(purpose, 360, 23), 600);
    ctx.textAlign = 'center';
    ctx.fillText(purpose, 300, 529);

    ctx.fillStyle = '#e38cae';
    setFont(17, 500);
    ctx.fillText('ご利用のサイズに合わせてカットしてご使用ください', 750, 529);

    if (sizeText) {
      ctx.fillStyle = '#49677f';
      setFont(15, 500, 'mono');
      ctx.fillText(sizeText, 1172, 529);
    }

    ctx.textAlign = 'left';
    drawVerticalText('証明写真', 1391, 142, 25, '#7b8da2', 600, 4);
    drawVerticalText('ID photo', 1435, 142, 25, '#7b8da2', 600, 4);

    ctx.fillStyle = 'rgba(255, 255, 255, .72)';
    ctx.fillRect(1373, 495, 92, 405);
    ctx.strokeStyle = 'rgba(65, 91, 115, .38)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(1373, 495, 92, 405);
    drawVerticalText('名前', 1385, 815, 14, '#3b4c5d', 500, 2);
    const nameLength = Math.max(1, [...name].length);
    const nameSize = Math.max(12, Math.min(25, Math.floor(350 / nameLength) - 3));
    drawVerticalText(name, 1418, 535, nameSize, '#273645', 500, 3);

    ctx.fillStyle = '#526b80';
    setFont(14, 500, 'mono');
    if (date) ctx.fillText(`撮影日  ${date}`, 132, 1012);
    if (serial) ctx.fillText(`受付番号  ${serial}`, 370, 1012);

    const notice = ui.noticeStyle.value === 'playful'
      ? '※かわいすぎる場合は不採用になることがあります。'
      : '※証明写真風の画像です。公的証明書には使用できません。';
    ctx.fillStyle = '#728698';
    setFont(13, 500);
    ctx.textAlign = 'center';
    ctx.fillText(notice, 820, 1012);
    ctx.textAlign = 'left';

    if (ui.showReceipt.checked) {
      ctx.fillStyle = 'rgba(255, 255, 255, .72)';
      ctx.fillRect(1090, 989, 265, 43);
      ctx.strokeStyle = 'rgba(65, 91, 115, .35)';
      ctx.strokeRect(1090, 989, 265, 43);
      ctx.fillStyle = '#526b80';
      setFont(11, 500, 'mono');
      ctx.fillText('RECEIPT  ¥1,000  CATCAT PHOTO SERVICE', 1102, 1016);
    }
  }

  function render() {
    drawPaper();
    slots.forEach((slot) => state.image ? drawPhoto(slot) : drawPlaceholder(slot));
    drawCutMarks();
    drawLabels();
  }

  function setStatus(message) {
    ui.status.textContent = message;
    if (message) window.setTimeout(() => {
      if (ui.status.textContent === message) ui.status.textContent = '';
    }, 3500);
  }

  function syncConditionalFields() {
    ui.purposeCustomField.hidden = ui.purpose.value !== 'custom';
    ui.dateCustomField.hidden = ui.dateMode.value !== 'custom';
    ui.serialCustomField.hidden = ui.serialMode.value !== 'custom';
  }

  function resetCrop() {
    state.zoom = 1;
    state.offsetX = 0;
    state.offsetY = 0;
    ui.zoom.value = '100';
    ui.zoomValue.value = '100%';
    render();
  }

  function clearPhoto() {
    if (state.imageUrl) URL.revokeObjectURL(state.imageUrl);
    state.image = null;
    state.imageUrl = '';
    ui.photoInput.value = '';
    ui.clearPhoto.disabled = true;
    ui.canvasHelp.hidden = false;
    resetCrop();
    setStatus('照片已從這個頁面清除。');
  }

  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      setStatus('請選擇圖片檔。');
      return;
    }
    if (state.imageUrl) URL.revokeObjectURL(state.imageUrl);
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      state.image = image;
      state.imageUrl = url;
      ui.clearPhoto.disabled = false;
      ui.canvasHelp.hidden = true;
      resetCrop();
      setStatus('照片已載入，只存在這個瀏覽器分頁裡。');
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      setStatus('這張圖片無法讀取，請換一個檔案格式。');
    };
    image.src = url;
  }

  function canvasPoint(event) {
    const rect = canvas.getBoundingClientRect();
    return { x: (event.clientX - rect.left) * W / rect.width, y: (event.clientY - rect.top) * H / rect.height };
  }

  function isInsidePhotoArea(point) {
    return slots.some((slot) => point.x >= slot.x && point.x <= slot.x + slot.w && point.y >= slot.y && point.y <= slot.y + slot.h);
  }

  ui.photoInput.addEventListener('change', () => loadFile(ui.photoInput.files[0]));
  ['dragenter', 'dragover'].forEach((type) => ui.uploadZone.addEventListener(type, (event) => {
    event.preventDefault(); ui.uploadZone.classList.add('is-dragging');
  }));
  ['dragleave', 'drop'].forEach((type) => ui.uploadZone.addEventListener(type, (event) => {
    event.preventDefault(); ui.uploadZone.classList.remove('is-dragging');
  }));
  ui.uploadZone.addEventListener('drop', (event) => loadFile([...event.dataTransfer.files].find((file) => file.type.startsWith('image/'))));

  ui.zoom.addEventListener('input', () => {
    state.zoom = Number(ui.zoom.value) / 100;
    clampCrop();
    ui.zoomValue.value = `${ui.zoom.value}%`;
    render();
  });
  ui.resetCrop.addEventListener('click', resetCrop);
  ui.clearPhoto.addEventListener('click', clearPhoto);

  ui.canvasWrap.addEventListener('pointerdown', (event) => {
    if (!state.image) return;
    const point = canvasPoint(event);
    if (!isInsidePhotoArea(point)) return;
    state.dragging = true;
    state.pointerX = point.x;
    state.pointerY = point.y;
    ui.canvasWrap.setPointerCapture(event.pointerId);
  });
  ui.canvasWrap.addEventListener('pointermove', (event) => {
    if (!state.dragging) return;
    const point = canvasPoint(event);
    state.offsetX += point.x - state.pointerX;
    state.offsetY += point.y - state.pointerY;
    clampCrop();
    state.pointerX = point.x;
    state.pointerY = point.y;
    render();
  });
  const endDrag = () => { state.dragging = false; };
  ui.canvasWrap.addEventListener('pointerup', endDrag);
  ui.canvasWrap.addEventListener('pointercancel', endDrag);

  [ui.displayName, ui.purposeCustom, ui.customDate, ui.customSerial].forEach((element) => element.addEventListener('input', render));
  [ui.purpose, ui.photoSize, ui.dateMode, ui.serialMode, ui.noticeStyle].forEach((element) => element.addEventListener('change', () => {
    syncConditionalFields(); render();
  }));
  ui.showReceipt.addEventListener('change', render);

  ui.download.addEventListener('click', () => {
    render();
    canvas.toBlob((blob) => {
      if (!blob) { setStatus('下載失敗，請再試一次。'); return; }
      const link = document.createElement('a');
      const name = (ui.displayName.value.trim() || 'id-photo').replace(/[\\/:*?"<>|]+/g, '-');
      link.href = URL.createObjectURL(blob);
      link.download = `${name}-証明写真風.png`;
      link.click();
      window.setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      setStatus('PNG 已產生。');
    }, 'image/png');
  });

  ui.customDate.value = localToday();
  syncConditionalFields();
  render();
})();
</script>
</body>
</html>
